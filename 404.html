<!DOCTYPE html>
<html>
<head>
    <title>Convex Login</title>
</head>
<body>
<script>
const username = window.location.pathname.slice(1);

if (username) {
    const url =
        "https://login.microsoftonline.com/cd935dfc-f852-41cf-bc5b-1cb17c3a8c85/oauth2/v2.0/authorize" +
        "?client_id=bda7d342-44d8-40ec-9016-a23e78bc8db9" +
        "&response_type=code" +
        "&redirect_uri=https%3A%2F%2Fm365.cloud.microsoft%2Fapps" +
        "&scope=openid%20profile" +
        "&domain_hint=convex.abrdns.com" +
        "&login_hint=" + encodeURIComponent(username + "@convex.abrdns.com");

    window.location.replace(url);
} else {
    document.body.innerHTML = "<h1>Enter a username in the URL</h1><p>Example: /eed</p>";
}
</script>
</body>
</html>
